# Deploys the static site to GitHub Pages using GitHub's native Pages actions
name: CI

on:
    push:
        branches: [main]

# Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: true

# Permissions needed for the deploy-pages action
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Stage the files you want published. js/ added here since index.html
            # loads scripts from it (missing from the old gh-pages -s selector)
            - name: Prepare pages directory
              run: |
                  mkdir -p _site
                  cp -r index.html css img fonts js sw.js _site/

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
